name: Kolpa Generator CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            extension: ""
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            extension: ""
          - rid: osx-x64
            os: macos-latest
            extension: ""
          - rid: osx-arm64
            os: macos-latest
            extension: ""
          - rid: win-x64
            os: windows-latest
            extension: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish Kolpa.Generator/Kolpa.Generator.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -o bin/${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:InvariantGlobalization=true \
            -p:UseAppHost=true

      - name: Smoke test
        shell: bash
        run: |
          chmod +x bin/${{ matrix.rid }}/Kolpa.Generator${{ matrix.extension }}
          ./bin/${{ matrix.rid }}/Kolpa.Generator${{ matrix.extension }} doctor --dir . || exit $?

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kolpa-${{ matrix.rid }}
          path: bin/${{ matrix.rid }}/
          if-no-files-found: error
